[pytest]
markers =
    unit: Pure function and narrow behavior tests that do not need the full FastAPI app lifecycle.
    repo: Repository and persistence tests focused on SqliteRepo, migrations, inheritance, cloning, and restore semantics.
    service: Service-layer orchestration tests below the HTTP API surface.
    api: FastAPI route and HTTP contract tests.
    smoke: High-value end-to-end checks kept in the default CI smoke path.
    slow: Significantly slower tests that should be excluded from the default fast path.
